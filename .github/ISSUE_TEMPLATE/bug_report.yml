name: バグ報告
description: 不具合を報告します
title: "[Bug] "
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        ありがとうございます。再現しやすい情報を最小限で記入してください。
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: どの操作で起きたかを順番に記載してください
      placeholder: |
        1. xxx を開く
        2. yyy をタップ
        3. zzz が発生
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      placeholder: こう動くはずだった
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      placeholder: 実際にはこうなった
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: 利用端末
      options:
        - iPad / iPhone
        - PC
        - その他
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: ブラウザ
      placeholder: Safari 17 / Chrome 122 など
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HomeDashバージョン
      placeholder: v0.1.0 など（不明なら unknown）
    validations:
      required: true
