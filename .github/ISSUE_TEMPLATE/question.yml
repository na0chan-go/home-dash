name: 質問
description: 使い方や運用について質問します
title: "[Question] "
body:
  - type: textarea
    id: question
    attributes:
      label: 聞きたいこと
      placeholder: 何に困っているかを具体的に記載してください
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 試したこと
      placeholder: すでに試した操作や確認内容
    validations:
      required: true
